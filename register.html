<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Notas App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="src/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-journal-richtext"></i> Notas App</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-auth">
                    <h2 class="text-center fw-bold mb-4">Crear Cuenta</h2>

                    <!-- Mensaje de éxito -->
                    <div id="successMessage" class="alert alert-success d-none" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <strong>¡Registro exitoso!</strong>
                        <p class="mb-0 mt-2" id="successMessageText"></p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required placeholder="tu@email.com">
                            <div id="emailError" class="text-danger d-none small"></div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" required
                                placeholder="Mínimo 8 caracteres">
                            <small class="text-muted">
                                Debe incluir mayúscula, minúscula, número y carácter especial
                            </small>
                            <div id="passwordError" class="text-danger d-none small"></div>
                        </div>
                        <div id="errorMessage" class="alert alert-danger d-none mb-3"></div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <span class="text-muted">© 2025 Notas App. Todos los derechos reservados.</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/js/config.js"></script>
    <script src="src/js/utils.js"></script>
    <script src="src/js/auth.js"></script>
    <script src="src/js/app.js"></script>
</body>

</html>
